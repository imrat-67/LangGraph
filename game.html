<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Snake</title>
<style>
  :root{
    --bg1:#0f0c29;
    --bg2:#302b63;
    --bg3:#24243e;
    --accent:#00f5d4;
    --accent2:#ff206e;
    --panel:rgba(255,255,255,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    background-size:400% 400%;
    animation:gradientShift 12s ease infinite;
    color:#fff;
    overflow:hidden;
  }
  @keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  h1{
    margin:0 0 6px;
    font-size:2.1rem;
    letter-spacing:2px;
    text-shadow:0 0 12px var(--accent);
  }
  .subtitle{
    opacity:0.7;
    margin-bottom:18px;
    font-size:0.9rem;
  }
  .panel{
    background:var(--panel);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:20px;
    padding:20px;
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
  }
  .hud{
    display:flex;
    justify-content:space-between;
    width:400px;
    max-width:90vw;
    margin-bottom:10px;
    font-weight:bold;
    letter-spacing:1px;
  }
  .hud span{color:var(--accent);}
  canvas{
    background:#0a0a1a;
    border-radius:14px;
    display:block;
    box-shadow:inset 0 0 20px rgba(0,245,212,0.25);
    touch-action:none;
  }
  .controls{
    margin-top:16px;
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
  }
  button{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none;
    color:#0a0a1a;
    font-weight:bold;
    padding:10px 20px;
    border-radius:30px;
    cursor:pointer;
    letter-spacing:1px;
    transition:transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow:0 4px 14px rgba(0,245,212,0.35);
  }
  button:hover{
    transform:translateY(-2px) scale(1.03);
    box-shadow:0 6px 18px rgba(255,32,110,0.4);
  }
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:10;
    text-align:center;
  }
  .overlay.show{display:flex;}
  .overlay h2{
    font-size:2rem;
    color:var(--accent2);
    text-shadow:0 0 14px var(--accent2);
    margin-bottom:6px;
  }
  footer{
    margin-top:14px;
    font-size:0.75rem;
    opacity:0.5;
  }
</style>
</head>
<body>
  <h1>NEON SNAKE</h1>
  <div class="subtitle">Use arrow keys / WASD, or swipe on mobile</div>

  <div class="panel">
    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Best: <span id="best">0</span></div>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn">Pause</button>
    </div>
  </div>

  <footer>Made for Imtiaj • Lightweight single-file HTML/CSS/JS game</footer>

  <div class="overlay" id="overlay">
    <h2>Game Over</h2>
    <p id="finalScore"></p>
    <button id="restartBtn">Play Again</button>
  </div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const box = 20;
const cols = canvas.width / box;
const rows = canvas.height / box;

let snake, dir, food, score, best, loopId, running, speed;
best = Number(localStorage.getItem('neonSnakeBest') || 0);
document.getElementById('best').textContent = best;

function randomFood(){
  return {
    x: Math.floor(Math.random()*cols),
    y: Math.floor(Math.random()*rows)
  };
}

function resetGame(){
  snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
  dir = {x:1,y:0};
  food = randomFood();
  score = 0;
  speed = 130;
  running = true;
  document.getElementById('score').textContent = score;
  document.getElementById('overlay').classList.remove('show');
}
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // grid glow
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // food
  ctx.fillStyle = '#ff206e';
  ctx.shadowColor = '#ff206e';
  ctx.shadowBlur = 12;
  ctx.fillRect(food.x*box, food.y*box, box-2, box-2);

  // snake
  ctx.shadowColor = '#00f5d4';
  ctx.shadowBlur = 8;
  snake.forEach((seg,i)=>{
    ctx.fillStyle = i===0 ? '#00f5d4' : 'rgba(0,245,212,0.75)';
    ctx.fillRect(seg.x*box, seg.y*box, box-2, box-2);
  });
  ctx.shadowBlur = 0;
}

function update(){
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  if(head.x<0 || head.y<0 || head.x>=cols || head.y>=rows || snake.some(s=>s.x===head.x && s.y===head.y)){
    gameOver();
    return;
  }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    score++;
    document.getElementById('score').textContent = score;
    food = randomFood();
    if(speed>60) speed -= 3;
  } else {
    snake.pop();
  }
}
function gameOver(){
  running = false;
  clearTimeout(loopId);
  if(score > best){
    best = score;
    localStorage.setItem('neonSnakeBest', best);
    document.getElementById('best').textContent = best;
  }
  document.getElementById('finalScore').textContent = 'Your score: ' + score;
  document.getElementById('overlay').classList.add('show');
}

function loop(){
  if(!running) return;
  update();
  if(running){
    draw();
    loopId = setTimeout(loop, speed);
  }
}

document.addEventListener('keydown', (e)=>{
  const k = e.key.toLowerCase();
  if((k==='arrowup'||k==='w') && dir.y===0) dir = {x:0,y:-1};
  else if((k==='arrowdown'||k==='s') && dir.y===0) dir = {x:0,y:1};
  else if((k==='arrowleft'||k==='a') && dir.x===0) dir = {x:-1,y:0};
  else if((k==='arrowright'||k==='d') && dir.x===0) dir = {x:1,y:0};
});
// simple swipe support for mobile
let touchStartX=0, touchStartY=0;
canvas.addEventListener('touchstart', e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx>20 && dir.x===0) dir={x:1,y:0};
    else if(dx<-20 && dir.x===0) dir={x:-1,y:0};
  } else {
    if(dy>20 && dir.y===0) dir={x:0,y:1};
    else if(dy<-20 && dir.y===0) dir={x:0,y:-1};
  }
});

document.getElementById('startBtn').addEventListener('click', ()=>{
  clearTimeout(loopId);
  resetGame();
  draw();
  loop();
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  clearTimeout(loopId);
  resetGame();
  draw();
  loop();
});
document.getElementById('pauseBtn').addEventListener('click', ()=>{
  running = !running;
  if(running) loop();
});

resetGame();
draw();
</script>
</body>
</html>
